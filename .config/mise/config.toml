# Morphir Development Tools Configuration
# Tasks are defined as file-based scripts in .config/mise/tasks/

[settings]
experimental = true

[tools]
"npm:@fission-ai/openspec" = "1.14.3"
# Core tools
go = "1.27.3"
python = "3.15.2"

# JavaScript runtimes and package managers (for toolchain backend tests)
node = "26.13.1" # Provides npm and npx
bun = "1.4.4"    # Provides bunx - used for TypeScript task execution
deno = "2.9.8"   # Provides deno run npm:
yarn = "4.18.1"  # Provides yarn dlx (Yarn Berry)
pnpm = "12.18.0" # Provides pnpm dlx

# Development tools
golangci-lint = "2.15.0"  # Go linter aggregator

# Windows-specific tasks (inline tasks work on Windows, file-based tasks don't)
# These call bun to execute the TypeScript task implementations
[tasks."windows:workspace-setup"]
description = "Set up Go workspace (Windows)"
run = "bun .config/mise/tasks/workspace/setup.ts"

[tasks."windows:test"]
description = "Run tests (Windows)"
run = "bun .config/mise/tasks/test.ts"

[tasks."windows:build"]
description = "Build morphir binary (Windows)"
run = "bun .config/mise/tasks/build.ts"

[tools."github:moonrockz/mission-control"]
version = "0.1.0"
version_prefix = "tools-v"

[tools."github:moonrockz/mission-control".platforms]
linux-x64 = { asset_pattern = "mission-control-tools-linux-x64.tar.gz" }
linux-arm64 = { asset_pattern = "mission-control-tools-linux-arm64.tar.gz" }
macos-arm64 = { asset_pattern = "mission-control-tools-darwin-arm64.tar.gz" }
macos-x64 = { asset_pattern = "mission-control-tools-darwin-x64.tar.gz" }
windows-x64 = { asset_pattern = "mission-control-tools-windows-x64.zip" }
# No Windows arm64 build; Windows on Arm runs the x64 build under emulation.
windows-arm64 = { asset_pattern = "mission-control-tools-windows-x64.zip" }
