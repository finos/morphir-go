# Morphir Go - Development Environment Configuration
# See: https://mise.jdx.dev

# Tool versions
[tools]
go = "1.25.6"
bun = "latest"
node = "20"
golangci-lint = "latest"

# Environment variables
[env]
GO111MODULE = "on"

# Tasks are defined as TypeScript files in .config/mise/tasks/
# Run `mise tasks` to see all available tasks
# Run `mise run <task>` or `mise <task>` to execute a task
