# Morphir Go - Development Environment Configuration
# See: https://mise.jdx.dev

# Tool versions
[tools]
go = "1.25.5"
node = "20"
golangci-lint = "latest"

# Environment variables
[env]
GO111MODULE = "on"

# Default task
[tasks.default]
description = "List all available tasks"
run = "mise tasks"

# Build the CLI application
[tasks.build]
description = "Build the morphir CLI"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Building morphir CLI..."
# Determine binary extension based on GOOS (for cross-compilation) or current OS
EXT=""
if [ "${GOOS:-}" = "windows" ]; then
    EXT=".exe"
elif [ "${GOOS:-}" = "" ]; then
    # GOOS not set, detect current OS
    OS=$(./scripts/detect-os.sh)
    if [ "$OS" = "windows" ]; then
        EXT=".exe"
    fi
fi
# Create bin directory if it doesn't exist
mkdir -p bin
# Build the binary
go build -o "bin/morphir${EXT}" ./cmd/morphir
echo "✓ Built binary: bin/morphir${EXT}"
'''
sources = ["cmd/**/*.go", "pkg/**/*.go"]
outputs = ["bin/morphir"]

# Build the development version of the CLI (morphir-dev)
[tasks.build-dev]
description = "Build the morphir-dev CLI"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Building morphir-dev CLI..."
# Determine binary extension based on GOOS or current OS
EXT=""
if [ "${GOOS:-}" = "windows" ]; then
    EXT=".exe"
elif [ "${GOOS:-}" = "" ]; then
    OS=$(./scripts/detect-os.sh)
    if [ "$OS" = "windows" ]; then
        EXT=".exe"
    fi
fi
mkdir -p bin
go build -o "bin/morphir-dev${EXT}" ./cmd/morphir
echo "✓ Built binary: bin/morphir-dev${EXT}"
'''
sources = ["cmd/**/*.go", "pkg/**/*.go"]
outputs = ["bin/morphir-dev"]

# Run tests across all modules
[tasks.test]
description = "Execute all unit and BDD tests"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Running tests..."
for dir in cmd/morphir pkg/models pkg/tooling pkg/sdk pkg/pipeline; do
    if [ -d "$dir" ]; then
        echo "Testing $dir..."
        (cd "$dir" && go test ./...)
    fi
done
echo "✓ All tests passed!"
'''

# Format all Go code
[tasks.fmt]
description = "Format all Go code"
run = '''
echo "Formatting Go code..."
go fmt ./...
echo "✓ Code formatted!"
'''

# Check code formatting without modifying files
[tasks.fmt-check]
description = "Check code formatting"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Checking code formatting..."
UNFORMATTED=$(gofmt -s -l .)
if [ -n "$UNFORMATTED" ]; then
    echo "The following files are not formatted:"
    echo "$UNFORMATTED"
    echo ""
    echo "Run 'mise run fmt' to fix formatting issues."
    exit 1
else
    echo "✓ All files are properly formatted"
fi
'''

# Run linters (requires golangci-lint)
[tasks.lint]
description = "Run golangci-lint"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Running linters..."
if ! command -v golangci-lint > /dev/null; then
    echo "golangci-lint not found. Install with: mise install golangci-lint"
    exit 1
fi
for dir in cmd/morphir pkg/models pkg/tooling pkg/sdk pkg/pipeline; do
    echo "Linting $dir..."
    (cd "$dir" && golangci-lint run --timeout=5m)
done
echo "✓ Linting complete!"
'''

# Clean build artifacts
[tasks.clean]
description = "Clean build artifacts"
run = '''
echo "Cleaning build artifacts..."
if [ -d bin ]; then rm -rf bin; fi
go clean ./...
echo "✓ Clean complete!"
'''

# Download dependencies for all modules
[tasks.deps]
description = "Download dependencies for all modules"
run = '''
echo "Downloading dependencies..."
go work sync
go mod download ./...
echo "✓ Dependencies downloaded!"
'''

# Run go mod tidy for all modules
[tasks.mod-tidy]
description = "Run go mod tidy for all modules"
run = '''
#!/usr/bin/env bash
set -euo pipefail
OS=$(./scripts/detect-os.sh)
if [ "$OS" = "windows" ]; then
    if command -v pwsh >/dev/null 2>&1; then
        PS="pwsh"
    else
        PS="powershell"
    fi
    "$PS" -ExecutionPolicy Bypass -File scripts/mod-tidy.ps1
else
    ./scripts/mod-tidy.sh
fi
'''

# Install the CLI using go install (installs to $GOPATH/bin or $GOBIN)
[tasks.install]
description = "Install morphir CLI to $GOPATH/bin or $GOBIN"
run = '''
echo "Installing morphir CLI..."
go install ./cmd/morphir
echo "✓ Installed successfully!"
'''

# Install the development version as morphir-dev
[tasks.install-dev]
description = "Install morphir-dev to $GOPATH/bin or $GOBIN"
depends = ["build-dev"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
OS=$(./scripts/detect-os.sh)
if [ "$OS" = "windows" ]; then
    if command -v pwsh >/dev/null 2>&1; then
        PS="pwsh"
    else
        PS="powershell"
    fi
    "$PS" -ExecutionPolicy Bypass -File scripts/install-dev.ps1
else
    ./scripts/install-dev.sh
fi
'''

# Run the CLI application
[tasks.run]
description = "Run the morphir CLI"
depends = ["build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
EXT=""
OS=$(./scripts/detect-os.sh)
if [ "$OS" = "windows" ]; then
    EXT=".exe"
fi
"./bin/morphir${EXT}"
'''

# Run the development version of the CLI
[tasks.run-dev]
description = "Run the morphir-dev CLI"
depends = ["build-dev"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
EXT=""
OS=$(./scripts/detect-os.sh)
if [ "$OS" = "windows" ]; then
    EXT=".exe"
fi
"./bin/morphir-dev${EXT}"
'''

# Verify all modules build successfully
[tasks.verify]
description = "Verify all modules build successfully"
run = '''
#!/usr/bin/env bash
set -euo pipefail
OS=$(./scripts/detect-os.sh)
if [ "$OS" = "windows" ]; then
    if command -v pwsh >/dev/null 2>&1; then
        PS="pwsh"
    else
        PS="powershell"
    fi
    "$PS" -ExecutionPolicy Bypass -File scripts/verify.ps1
else
    ./scripts/verify.sh
fi
'''

# Set up development environment (install dependencies, git hooks, etc.)
[tasks.setup]
description = "Set up development environment"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Setting up development environment..."
echo "1. Syncing Go modules..."
go work sync
echo "2. Installing npm dependencies (for git hooks)..."
if command -v npm > /dev/null; then
    npm install
else
    echo "Warning: npm not found. Git hooks will not be installed."
    echo "Install Node.js from https://nodejs.org/ to enable git hooks."
fi
echo "3. Verifying git hooks are installed..."
if [ -f ".husky/pre-push" ]; then
    echo "   ✓ Git hooks installed successfully"
else
    echo "   ⚠ Git hooks not installed (npm install may have failed)"
fi
echo ""
echo "Development environment setup complete!"
echo "Run 'mise run build-dev' to build the development version."
'''

# Run CI checks (format, build, test, lint)
[tasks.ci-check]
description = "Full CI verification suite"
depends = ["fmt-check", "verify", "test", "lint"]
run = "echo '✓ All CI checks passed!'"

# Validate GoReleaser configuration
[tasks.goreleaser-check]
description = "Validate GoReleaser configuration"
run = '''
echo "Validating GoReleaser configuration..."
if command -v goreleaser > /dev/null; then
    goreleaser check
else
    echo "goreleaser not found. Install with: go install github.com/goreleaser/goreleaser@latest"
    exit 1
fi
'''

# Test release build locally (creates snapshot without publishing)
[tasks.release-snapshot]
description = "Build release snapshot (local test, no publish)"
run = '''
echo "Building release snapshot..."
if command -v goreleaser > /dev/null; then
    goreleaser release --snapshot --clean --skip=publish
else
    echo "goreleaser not found. Install with: go install github.com/goreleaser/goreleaser@latest"
    exit 1
fi
'''

# Full dry-run of release (validates everything without publishing)
[tasks.release-test]
description = "Test release process (validates without publishing)"
run = '''
echo "Testing release process..."
if command -v goreleaser > /dev/null; then
    goreleaser release --skip=publish --clean
else
    echo "goreleaser not found. Install with: go install github.com/goreleaser/goreleaser@latest"
    exit 1
fi
'''

# Note: Actual releases are handled by GitHub Actions on tag push
# To release: git tag -a vX.Y.Z -m "Release X.Y.Z" && git push origin vX.Y.Z
